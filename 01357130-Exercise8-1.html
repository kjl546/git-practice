<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Doraemon</title>
    <style>
        @import url(https://fonts.googleapis.com/earlyaccess/cwtexkai.css);

        body {
            font-family: "Noto Sans TC", Perpetua, serif;
            max-width: 600px;
            margin: 20px auto;
            text-align: center;
            background-color: #f5f5f5;
        }

        #gadget {
            width: 300px;
            height: 300px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: white;
            margin: 20px auto;
            display: block;
        }

        #play {
            width: 200px;
            height: 60px;
            font-size: 120%;
            padding: 10px 0;
            background-color: dodgerblue;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: block;
            margin: 20px auto;
        }

        #play:hover {
            background-color: rgba(30, 144, 255, 0.8);
        }

        #messages {
            font-size: 120%;
            width: 300px;
            padding: 15px;
            background-color: white;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            margin: 20px auto;
            box-sizing: border-box;
            min-height: 80px;
        }
    </style>
    <script>
        const gadgetString = "任意門 時光機 竹蜻蜓 時光布 記憶麵包 縮小燈 翻譯蒟蒻 如果電話亭 穿透環 更衣照相機";
        const gadgetToken = gadgetString.split(" ");

        function start(){
            let sound = document.getElementById("sound");
            let gadget = document.getElementById("gadget");
            
            let play = document.getElementById("play");
            play.addEventListener("click", startGame, false);
        }

        function startGame(){
            sound.play();
            gadget.src = "blank.png";
            sound.addEventListener("ended", randomSelect, false);
        }

        function randomSelect(){
            let messages = document.getElementById("messages");
            let select = Math.floor(1 + Math.random() * 10);
            gadget.src = "0" + select + ".png";
            content = "您抽到" + gadgetToken[select-1] + "!";
            messages.innerHTML = content;
        }
        
        window.addEventListener("load", start, false);
    </script>
</head>

<body>
    <audio id="sound" preload="auto">
        <source src="doraemon.mp3" type="audio/mpeg">
        Browser does not support audio tag
    </audio>

    <img id="gadget" src="00.png" alt="gadget">
    <form action="#">
        <input id="play" type="button" value="抽出我的道具">
    </form>
    <div id="messages">請按下Button抽出道具</div>
</body>

</html>
